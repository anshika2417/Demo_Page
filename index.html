<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Interactive Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Welcome to the Interactive Page</h1>
    <p>Your gateway to a visually stunning experience</p>
  </header>

  <main class="main-content">
    <!-- Image Section -->
    <section class="image-section">
      <h2>Explore the Beauty of Nature</h2>
      <div class="gallery">
        <img src="landscape.jpg" alt="Beautiful Landscape">
        <img src="lights.jpg" alt="City Lights">
        <img src="mountain.jpg" alt="Mountain View">
        <img src="sunset.jpeg" alt="Sunset by the Beach">
      </div>
    </section>

    <!-- Audio Section -->
    <section class="audio-section">
      <h2>Relax with Soothing Music</h2>
      <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </section>

    <!-- Button Section -->
    <section class="button-section">
      <h2>Take Action</h2>
      <div class="button-group">
        <button onclick="alert('Learn More Button Clicked!')">Learn More</button>
        <button onclick="alert('Subscribe Button Clicked!')">Subscribe</button>
        <button onclick="alert('Get Started Button Clicked!')">Get Started</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Interactive Page. Designed with passion.</p>
  </footer>
</body>
</html>
